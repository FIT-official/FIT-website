<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture sim</title><style>body{margin:0;font-family:system-ui}canvas{width:100%}</style></head>
<body><h1>Fixture</h1><canvas id="c" width="320" height="180"></canvas><p id="out">0</p>
<script>const c=document.getElementById('c').getContext('2d');let n=0;function draw(){c.clearRect(0,0,320,180);c.fillStyle='#2EC4A6';c.fillRect(10,10,n%300,40)}document.body.addEventListener('click',()=>{n+=20;draw();document.getElementById('out').textContent=n});draw()</script></body></html>
