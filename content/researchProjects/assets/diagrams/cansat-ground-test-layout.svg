<title id="t">Surveyed ground test (no launch)</title>
<desc id="d">Plan view of an open field with a tracking antenna on a tripod at one end and a row of numbered stakes at increasing distances along a measured line. A second arc of stakes at one fixed distance shows angular offsets. The transmitter is held at each stake in turn.</desc>
