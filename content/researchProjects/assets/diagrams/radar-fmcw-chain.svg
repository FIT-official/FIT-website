<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Processing chain from chirp to range-Doppler map</title>
<desc id="d">Block diagram: chirp generator feeds a transmit antenna. A receive antenna and mixer produce a beat signal that is sampled. A range FFT along each chirp is followed by a Doppler FFT across chirps to give a range-Doppler map with a peak at the target.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker></defs>
<rect x="0.75" y="0.75" width="638.5" height="378.5" rx="10" fill="#ffffff" stroke="#5b6877" stroke-width="1.5"/>
<text x="16" y="24" font-size="11" fill="#5b6877" text-anchor="start" font-weight="700">DIAGRAM · original explanatory illustration, not a photograph</text>
<text x="16" y="48" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="700">Processing chain from chirp to range-Doppler map</text>
<rect x="24" y="90" width="110" height="50" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="79" y="111.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Chirp</text><text x="79" y="126.5" font-size="13" fill="#1b2a3a" text-anchor="middle">generator</text>
<rect x="170" y="90" width="110" height="50" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="225" y="111.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Transmit</text><text x="225" y="126.5" font-size="13" fill="#1b2a3a" text-anchor="middle">antenna</text>
<line x1="134" y1="115" x2="170" y2="115" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="340" cy="115" r="6" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="340" y="146" font-size="12" fill="#1b2a3a" text-anchor="middle">target (R, v)</text>
<line x1="280" y1="108" x2="334" y2="114" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="420" y="90" width="110" height="50" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="475" y="111.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Receive</text><text x="475" y="126.5" font-size="13" fill="#1b2a3a" text-anchor="middle">antenna</text>
<line x1="346" y1="114" x2="420" y2="108" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="24" y="200" width="110" height="50" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="79" y="221.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Mixer</text><text x="79" y="236.5" font-size="13" fill="#1b2a3a" text-anchor="middle">(beat tone)</text>
<line x1="475" y1="140" x2="475" y2="170" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="475" y1="170" x2="80" y2="170" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="80" y1="170" x2="80" y2="200" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="170" y="200" width="110" height="50" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="225" y="221.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Sample</text><text x="225" y="236.5" font-size="13" fill="#1b2a3a" text-anchor="middle">(N per chirp)</text>
<line x1="134" y1="225" x2="170" y2="225" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="316" y="200" width="110" height="50" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="371" y="221.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Range FFT</text><text x="371" y="236.5" font-size="13" fill="#1b2a3a" text-anchor="middle">(each chirp)</text>
<line x1="280" y1="225" x2="316" y2="225" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="462" y="200" width="120" height="50" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="522" y="221.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Doppler FFT</text><text x="522" y="236.5" font-size="13" fill="#1b2a3a" text-anchor="middle">(across M chirps)</text>
<line x1="426" y1="225" x2="462" y2="225" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400" y="290" width="180" height="70" rx="6" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="408" y="298" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="408" y="318" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="408" y="338" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="436" y="298" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="436" y="318" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="436" y="338" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="464" y="298" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="464" y="318" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="464" y="338" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="492" y="298" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="492" y="318" width="26" height="18" fill="#b45309" stroke="#5b6877"/>
<rect x="492" y="338" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="520" y="298" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="520" y="318" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="520" y="338" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="548" y="298" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="548" y="318" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<rect x="548" y="338" width="26" height="18" fill="#eef3f8" stroke="#5b6877"/>
<line x1="522" y1="250" x2="522" y2="290" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="24" y="300" font-size="13" fill="#1b2a3a" text-anchor="start">f(b) = 2BR / (cT)    range resolution = c / 2B</text>
<text x="24" y="324" font-size="13" fill="#1b2a3a" text-anchor="start">f(d) = 2v / lambda    v(max) = lambda / 4T</text>
<text x="490" y="376" font-size="12" fill="#1b2a3a" text-anchor="middle">range-Doppler map: one peak</text>
</svg>
