<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Two pupil circles and their overlap</title>
<desc id="d">Two equal circles of radius R whose centres are a distance delta apart on a horizontal line. The lens-shaped intersection is shaded and labelled overlap.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker></defs>
<rect x="0.75" y="0.75" width="638.5" height="378.5" rx="10" fill="#ffffff" stroke="#5b6877" stroke-width="1.5"/>
<text x="16" y="24" font-size="11" fill="#5b6877" text-anchor="start" font-weight="700">DIAGRAM · original explanatory illustration, not a photograph</text>
<text x="16" y="48" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="700">Two pupil circles and their overlap</text>
<clipPath id="c1"><circle cx="270" cy="200" r="110"/></clipPath>
<circle cx="370" cy="200" r="110" fill="#bfdbfe" clip-path="url(#c1)"/>
<circle cx="270" cy="200" r="110" fill="none" stroke="#1f5fa8" stroke-width="2.5"/>
<circle cx="370" cy="200" r="110" fill="none" stroke="#b45309" stroke-width="2.5"/>
<circle cx="270" cy="200" r="4" fill="#1f5fa8" stroke="#1b2a3a" stroke-width="1.5"/>
<circle cx="370" cy="200" r="4" fill="#b45309" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="270" y1="200" x2="270" y2="90" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="258" y="150" font-size="14" fill="#1f5fa8" text-anchor="start" font-weight="700">R</text>
<line x1="270" y1="320" x2="370" y2="320" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="370" y1="320" x2="270" y2="320" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="320" y="342" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="700">delta (pupil shift)</text>
<text x="320" y="206" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="700">overlap</text>
<text x="500" y="140" font-size="12" fill="#1b2a3a" text-anchor="start">A / (pi R^2) =</text>
<text x="500" y="158" font-size="12" fill="#1b2a3a" text-anchor="start">(2/pi)[acos q</text>
<text x="500" y="176" font-size="12" fill="#1b2a3a" text-anchor="start">  - q sqrt(1 - q^2)]</text>
<text x="500" y="202" font-size="12" fill="#1b2a3a" text-anchor="start">q = delta / 2R</text>
<text x="24" y="372" font-size="12" fill="#5b6877" text-anchor="start">How much overlap a reconstruction needs is something you test.</text>
</svg>
