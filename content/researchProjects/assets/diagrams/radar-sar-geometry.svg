<rect x="400" y="288" width="24" height="24" rx="3" fill="#b45309" stroke="#1b2a3a" stroke-width="1.5"/><line x1="412" y1="288" x2="320" y2="110" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="500" y="288" width="24" height="24" rx="3" fill="#b45309" stroke="#1b2a3a" stroke-width="1.5"/><line x1="512" y1="288" x2="320" y2="110" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4"/>
