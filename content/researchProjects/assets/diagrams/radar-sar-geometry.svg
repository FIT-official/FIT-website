<text x="16" y="24" font-size="11" fill="#5b6877" text-anchor="start" font-weight="700">DIAGRAM · original explanatory illustration, not a photograph</text>
<text x="16" y="48" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="700">Synthetic aperture geometry (optional extension)</text>
<line x1="80" y1="300" x2="560" y2="300" stroke="#1b2a3a" stroke-width="3"/>
