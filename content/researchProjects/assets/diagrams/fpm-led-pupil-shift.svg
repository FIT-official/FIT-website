<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">LED angle shifts the sampled region of the spectrum</title>
<desc id="d">Left: three LEDs at different positions above a sample illuminate it at different angles toward an objective. Right: the sample spectrum drawn as a wide band with three overlapping circles of equal size, each shifted according to its LED angle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker></defs>
<rect x="0.75" y="0.75" width="638.5" height="378.5" rx="10" fill="#ffffff" stroke="#5b6877" stroke-width="1.5"/>
<text x="16" y="24" font-size="11" fill="#5b6877" text-anchor="start" font-weight="700">DIAGRAM · original explanatory illustration, not a photograph</text>
<text x="16" y="48" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="700">LED angle shifts the sampled region of the spectrum</text>
<circle cx="40" cy="100" r="8" fill="#b45309" stroke="#1b2a3a" stroke-width="1.5"/><line x1="40" y1="108" x2="110" y2="250" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="110" cy="100" r="8" fill="#b45309" stroke="#1b2a3a" stroke-width="1.5"/><line x1="110" y1="108" x2="110" y2="250" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="180" cy="100" r="8" fill="#b45309" stroke="#1b2a3a" stroke-width="1.5"/><line x1="180" y1="108" x2="110" y2="250" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="110" y="80" font-size="12" fill="#1b2a3a" text-anchor="middle">LED array</text>
<rect x="70" y="250" width="80" height="10" rx="2" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="160" y="262" font-size="12" fill="#1b2a3a" text-anchor="start">sample</text>
<rect x="85" y="296" width="50" height="36" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="110" y="318" font-size="11" fill="#1b2a3a" text-anchor="middle">objective</text>
<line x1="110" y1="260" x2="110" y2="296" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="70" x2="300" y2="340" stroke="#5b6877" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="84" font-size="13" fill="#1b2a3a" text-anchor="start" font-weight="700">Fourier plane (sample spectrum)</text>
<rect x="330" y="170" width="290" height="60" fill="#eef3f8" stroke="#5b6877"/>
<circle cx="430" cy="200" r="40" fill="none" stroke="#1f5fa8" stroke-width="2.5"/>
<circle cx="475" cy="200" r="40" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="520" cy="200" r="40" fill="none" stroke="#1b7a4b" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="400" y="262" font-size="12" fill="#1f5fa8" text-anchor="middle">centre LED</text>
<text x="560" y="282" font-size="12" fill="#1b7a4b" text-anchor="middle">tilted LED shifts the pupil</text>
<line x1="430" y1="300" x2="520" y2="300" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="320" font-size="12" fill="#1b2a3a" text-anchor="middle">shift k = sin(theta) / lambda</text>
<text x="24" y="372" font-size="13" fill="#5b6877" text-anchor="start">NA(synthetic) = NA(objective) + sin(theta max)</text>
</svg>
