<script>
/* FIT-CALC-BEGIN x8_algorithms */
const FITCalcX8 = (function () {
  'use strict';

  const API_VERSION = 1;
  const MAX_SAFE = Number.MAX_SAFE_INTEGER;

  function failure(error, reason) {
    return { error, reason };
  }

  function integer(n) {
    return typeof n === 'number' &&
      Number.isSafeInteger(n);
  }

  function number(n) {
    return Number(n);
  }

  function sorted(values) {
    return values.slice().sort((a, b) =>
      a < b ? -1 : a > b ? 1 : 0
    );
  }

  function validSequence(seq) {
    if (typeof seq !== 'string') {
      return failure('ConstraintViolation', 'invalid_base');
    }
    const upper = seq.toUpperCase();
    if (/[^ACGT]/.test(upper)) {
      return failure('ConstraintViolation', 'invalid_base');
    }
    if (upper.length > 300) {
      return failure('ConstraintViolation', 'bases_exceed_300');
    }
    return { seq: upper };
  }

  function graphData(graph) {
    if (!graph || typeof graph !== 'object' ||
        Array.isArray(graph)) {
      return failure('ConstraintViolation', 'invalid_graph');
    }

    const names = new Set(Object.keys(graph));
    for (const vertex of Object.keys(graph)) {
      const edges = graph[vertex];
      if (!edges || typeof edges !== 'object' ||
          Array.isArray(edges)) {
        return failure('ConstraintViolation', 'invalid_graph');
      }
      for (const neighbour of Object.keys(edges)) {
        names.add(neighbour);
        if (!integer(edges[neighbour])) {
          return failure('ConstraintViolation', 'invalid_edge_weight');
        }
        if (edges[neighbour] < 0) {
          return failure('ConstraintViolation', 'negative_edge_weight');
        }
      }
    }

    if (names.size > 10) {
      return failure('ConstraintViolation', 'vertices_exceed_10');
    }

    const vertices = sorted([...names]);
    const adjacency = {};
    for (const vertex of vertices) {
      adjacency[vertex] = graph[vertex] || {};
    }

    return { vertices, adjacency };
  }

  function gcdBig(a, b) {
    let oldR = a;
    let r = b;
    let oldS = 1n;
    let s = 0n;
    let oldT = 0n;
    let t = 1n;
    const trace = [];

    while (r !== 0n) {
      const q = oldR / r;
      const nextR = oldR - q * r;
      trace.push([
        number(oldR),
        number(q),
        number(r),
        number(nextR)
      ]);
      [oldR, r] = [r, nextR];
      [oldS, s] = [s, oldS - q * s];
      [oldT, t] = [t, oldT - q * t];
    }

    return {
      gcd: oldR,
      x: oldS,
      y: oldT,
      trace
    };
  }

  function tokensFor(formula) {
    if (typeof formula !== 'string') return null;
    const tokens = [];
    let i = 0;

    while (i < formula.length) {
      if (/\s/.test(formula[i])) {
        i++;
        continue;
      }

      if (formula.slice(i, i + 3) === '<->') {
        tokens.push('<->');
        i += 3;
      } else if (formula.slice(i, i + 2) === '->') {
        tokens.push('->');
        i += 2;
      } else if ('~&|()'.includes(formula[i])) {
        tokens.push(formula[i]);
        i++;
      } else {
        const match = /^[A-Za-z_][A-Za-z_0-9]*/
          .exec(formula.slice(i));
        if (!match) return null;
        tokens.push(match[0]);
        i += match[0].length;
      }
    }
    return tokens;
  }

  /**
   * Evaluate a propositional formula by recursive descent.
   * Input: {formula:string, vars:string[]} (Boolean, dimensionless).
   * Output: {column:number[], class:string}; optional row assignments.
   * Assumptions: ~, &, |, ->, <-> in increasing looseness;
   * implication associates right; first variable is the MSB.
   * Errors: variables_exceed_4; formula_syntax_error.
   * Hand check: P -> Q gives column [1,1,0,1], contingent.
   */
  function truth_table({ formula, vars } = {}) {
    if (!Array.isArray(vars)) {
      return failure('CompileError', 'formula_syntax_error');
    }
    if (vars.length > 4) {
      return failure('ConstraintViolation', 'variables_exceed_4');
    }
    if (new Set(vars).size !== vars.length ||
        vars.some(v => typeof v !== 'string' ||
          !/^[A-Za-z_][A-Za-z_0-9]*$/.test(v))) {
      return failure('CompileError', 'formula_syntax_error');
    }

    const tokens = tokensFor(formula);
    if (!tokens) {
      return failure('CompileError', 'formula_syntax_error');
    }

    let pos = 0;
    const allowed = new Set(vars);

    function atom() {
      const token = tokens[pos++];
      if (token === '(') {
        const value = equivalence();
        if (!value || tokens[pos++] !== ')') return null;
        return value;
      }
      if (allowed.has(token)) return ['var', token];
      return null;
    }

    function unary() {
      if (tokens[pos] === '~') {
        pos++;
        const child = unary();
        return child ? ['not', child] : null;
      }
      return atom();
    }

    function conjunction() {
      let left = unary();
      while (left && tokens[pos] === '&') {
        pos++;
        const right = unary();
        if (!right) return null;
        left = ['and', left, right];
      }
      return left;
    }

    function disjunction() {
      let left = conjunction();
      while (left && tokens[pos] === '|') {
        pos++;
        const right = conjunction();
        if (!right) return null;
        left = ['or', left, right];
      }
      return left;
    }

    function implication() {
      const left = disjunction();
      if (!left) return null;
      if (tokens[pos] === '->') {
        pos++;
        const right = implication();
        return right ? ['implies', left, right] : null;
      }
      return left;
    }

    function equivalence() {
      let left = implication();
      while (left && tokens[pos] === '<->') {
        pos++;
        const right = implication();
        if (!right) return null;
        left = ['iff', left, right];
      }
      return left;
    }

    const tree = equivalence();
    if (!tree || pos !== tokens.length) {
      return failure('CompileError', 'formula_syntax_error');
    }

    function evaluate(node, values) {
      const op = node[0];
      if (op === 'var') return values[node[1]];
      if (op === 'not') return 1 - evaluate(node[1], values);
      const a = evaluate(node[1], values);
      const b = evaluate(node[2], values);
      if (op === 'and') return a & b;
      if (op === 'or') return a | b;
      if (op === 'implies') return a === 1 && b === 0 ? 0 : 1;
      return a === b ? 1 : 0;
    }

    const column = [];
    const assignments = [];
    const count = 2 ** vars.length;

    for (let row = 0; row < count; row++) {
      const values = {};
      vars.forEach((v, j) => {
        values[v] = Math.floor(
          row / (2 ** (vars.length - j - 1))
        ) % 2;
      });
      assignments.push(values);
      column.push(evaluate(tree, values));
    }

    const ones = column.reduce((sum, value) => sum + value, 0);
    return {
      column,
      class: ones === count ? 'tautology' :
        ones === 0 ? 'contradiction' : 'contingent',
      assignments
    };
  }

  /**
   * Extended Euclidean algorithm for non-negative integers.
   * Input: {a:number,b:number}, dimensionless safe integers.
   * Output: {gcd,x,y,steps,first_step,trace}.
   * Assumption: Euclidean division, r0=a and r1=b.
   * Errors: gcd_of_zero_and_zero_undefined;
   * inputs_must_be_non_negative_integers.
   * Hand check: (240,46) gives gcd=2, x=-9, y=47;
   * first division [240,5,46,10] and five steps.
   */
  function euclid({ a, b } = {}) {
    if (!integer(a) || !integer(b) || a < 0 || b < 0) {
      return failure(
        'ConstraintViolation',
        'inputs_must_be_non_negative_integers'
      );
    }
    if (a === 0 && b === 0) {
      return failure('MathError', 'gcd_of_zero_and_zero_undefined');
    }

    const result = gcdBig(BigInt(a), BigInt(b));
    return {
      gcd: number(result.gcd),
      x: number(result.x),
      y: number(result.y),
      steps: result.trace.length,
      first_step: result.trace[0] || null,
      trace: result.trace
    };
  }

  /**
   * Modular addition, subtraction, multiplication, exponentiation
   * and multiplicative inverse.
   * Input: {op:string,a:number,b:number,m:number}, safe integers,
   * all dimensionless; b is unused for inverse.
   * Output: {r:number,trace?:object[]}, 0 <= r < m.
   * Assumptions: BigInt integer arithmetic; exponentiation uses
   * left-to-right processing of the exponent's least-significant
   * bits with repeated squaring.
   * Errors: modulus_must_be_positive, exponent_must_be_non_negative,
   * no_inverse_gcd_not_1, modular_op_not_supported;
   * invalid_integer_input.
   * Hand checks: 7^13 mod 11 = 2;
   * inverse(7,11)=8; (-3+5) mod 7=2.
   */
  function modular({ op, a, b, m } = {}) {
    if (!integer(m) || m <= 0) {
      return failure('ConstraintViolation', 'modulus_must_be_positive');
    }
    if (!['add', 'sub', 'mul', 'pow', 'inverse'].includes(op)) {
      return failure('NotSupported', 'modular_op_not_supported');
    }
    if (!integer(a) ||
        (op !== 'inverse' && !integer(b))) {
      return failure('ConstraintViolation', 'invalid_integer_input');
    }
    if (op === 'pow' && b < 0) {
      return failure(
        'ConstraintViolation',
        'exponent_must_be_non_negative'
      );
    }

    const M = BigInt(m);
    const A = BigInt(a);
    const B = op === 'inverse' ? 0n : BigInt(b);
    const residue = v => (v % M + M) % M;

    if (op === 'add') return { r: number(residue(A + B)) };
    if (op === 'sub') return { r: number(residue(A - B)) };
    if (op === 'mul') return { r: number(residue(A * B)) };

    if (op === 'inverse') {
      const extended = gcdBig(residue(A), M);
      if (extended.gcd !== 1n) {
        return failure('MathError', 'no_inverse_gcd_not_1');
      }
      return { r: number(residue(extended.x)) };
    }

    let exponent = B;
    let base = residue(A);
    let accumulator = 1n % M;
    let bit = 0;
    const trace = [];

    while (exponent > 0n) {
      if ((exponent & 1n) === 1n) {
        accumulator = residue(accumulator * base);
        if (trace.length < 200) {
          trace.push({
            action: 'multiply',
            bit,
            value: number(accumulator)
          });
        }
      }
      base = residue(base * base);
      if (trace.length < 200) {
        trace.push({
          action: 'square',
          bit,
          value: number(base)
        });
      }
      exponent >>= 1n;
      bit++;
    }

    return { r: number(accumulator), trace };
  }

  /**
   * Visit vertices using breadth-first or recursive depth-first search.
   * Input: {graph:adjacencyMap,start:string,kind:'bfs'|'dfs'}.
   * Edge weights are dimensionless and irrelevant to traversal.
   * Output: {order:string[],trace:object[]}.
   * Assumptions: directed edges; ascending neighbour labels.
   * Errors: vertices_exceed_10, unknown_vertex,
   * traversal_kind_not_supported, invalid_graph/edge_weight.
   * Hand check: A->{B,C}, B->{D}, C->{D}:
   * BFS A,B,C,D; DFS A,B,D,C.
   */
  function graph_traverse({ graph, start, kind } = {}) {
    const data = graphData(graph);
    if (data.error) return data;
    if (!data.vertices.includes(start)) {
      return failure('ConstraintViolation', 'unknown_vertex');
    }
    if (kind !== 'bfs' && kind !== 'dfs') {
      return failure(
        'NotSupported',
        'traversal_kind_not_supported'
      );
    }

    const order = [];
    const trace = [];
    const visited = new Set();

    if (kind === 'bfs') {
      const queue = [start];
      visited.add(start);
      while (queue.length) {
        const vertex = queue.shift();
        order.push(vertex);
        for (const next of sorted(
          Object.keys(data.adjacency[vertex])
        )) {
          if (!visited.has(next)) {
            visited.add(next);
            queue.push(next);
          }
        }
        trace.push({ vertex, frontier: queue.slice() });
      }
    } else {
      function visit(vertex) {
        visited.add(vertex);
        order.push(vertex);
        trace.push({ vertex, frontier: [] });
        for (const next of sorted(
          Object.keys(data.adjacency[vertex])
        )) {
          if (!visited.has(next)) visit(next);
        }
      }
      visit(start);
    }

    return { order, trace };
  }

  /**
   * Dijkstra shortest paths from a start vertex.
   * Input: {graph:adjacencyMap,start:string}; weights are
   * non-negative, dimensionless integer costs.
   * Output: {dist,paths,path_to_F,trace,settlement_order}.
   * Unreachable distances and paths are null.
   * Assumptions: directed edges, ascending-label tie-breaking;
   * predecessors change only on strict improvement.
   * Errors: negative_edge_weight, vertices_exceed_10,
   * unknown_vertex, invalid_graph/edge_weight,
   * distance_exceeds_safe_integer.
   * Hand check: A->B=2,A->C=5,B->C=1 gives
   * dist {A:0,B:2,C:3}; path to C is A,B,C.
   */
  function shortest_path({ graph, start } = {}) {
    const data = graphData(graph);

    const settlement_order = [];

      distances[vertex] = null;
      previous[vertex] = null;

    distances[start] = 0n;

    while (true) {
      let current = null;

      for (const vertex of data.vertices) {
        if (settled.has(vertex) || distances[vertex] === null) {
          continue;
        }
        if (current === null ||
            distances[vertex] < distances[current]) {
          current = vertex;
        }
      }
      if (current === null) break;

      settled.add(current);
      settlement_order.push(current);

      for (const next of sorted(
        Object.keys(data.adjacency[current])

        if (settled.has(next)) continue;
        const candidate = distances[current] +
          BigInt(data.adjacency[current][next]);

        if (candidate > BigInt(MAX_SAFE)) {
          return failure(
            'RuntimeError',
            'distance_exceeds_safe_integer'
          );
        }
        if (distances[next] === null ||
            candidate < distances[next]) {
          distances[next] = candidate;
          previous[next] = current;
        }
      }

      const snapshot = {};
      for (const vertex of data.vertices) {
        snapshot[vertex] = distances[vertex] === null ?
          null : number(distances[vertex]);
      }
      trace.push({
        vertex: current,
        dist: snapshot,
        settled: settlement_order.slice()
      });
    }

    const dist = {};
    const paths = {};

    for (const vertex of data.vertices) {
      dist[vertex] = distances[vertex] === null ?
        null : number(distances[vertex]);

      if (dist[vertex] === null) {
        paths[vertex] = null;
      } else {
        const path = [];
        let at = vertex;
        while (at !== null) {
          path.unshift(at);
          at = previous[at];
        }
        paths[vertex] = path;
      }

   * Output: {protein:string[],reverse_complement:string,

   * Assumptions: translation begins at the first base and
   * includes the first Stop; incomplete final codons ignored.
   * Errors: invalid_base, bases_exceed_300 (in that order).
   * Hand check: ATGGCTTAA -> [Met,Ala,Stop],

   */

    if (validated.error) return validated;

      const amino = code[s.slice(i, i + 3)];

    const reverse_complement = [...s].reverse()
      .map(base => complement[base]).join('');

      base === 'G' || base === 'C'

      reverse_complement,

   * Find forward-strand ATG-to-stop open reading frames.
   * Input: {seq:string,min_aa:number}; min_aa is a non-negative
   * dimensionless amino-acid count.
   * Output: {orfs:[{frame,start,end,aa}]}.
   * Positions are 1-based base indices; end includes the stop.
   * Assumptions: forward frames 1,2,3; resume after each stop;
   * nested ATGs inside a completed ORF are skipped.
   * Errors: invalid_base, bases_exceed_300,
   * min_aa_must_be_non_negative_integer.
   * Hand check: ATGAAATAA, min_aa=2 yields
   * [{frame:1,start:1,end:9,aa:2}].
   */
  function reading_frames({ seq, min_aa } = {}) {
    const validated = validSequence(seq);
    if (validated.error) return validated;
    if (!integer(min_aa) || min_aa < 0) {
      return failure(
        'ConstraintViolation',
        'min_aa_must_be_non_negative_integer'
      );
    }

    const s = validated.seq;
    const orfs = [];

    for (let frame = 0; frame < 3; frame++) {
      let i = frame;

      while (i + 3 <= s.length) {
        if (s.slice(i, i + 3) !== 'ATG') {
          i += 3;
          continue;
        }

          orfs.push({
            frame: frame + 1,
            start: i + 1,
            end: stop + 3,
            aa
          });
        }
        i = stop + 3;
      }
    }

      `<rect x="45" y="${lane(j+1)-22}" width="334" height="45"
        rx="8" fill="#F4F3EF" stroke="#E4E2DB" stroke-width="2"/>
       <text x="8" y="${lane(j+1)+4}" font-size="12" font-weight="800">
         F${j+1}</text>`).join('');

    const mark= (orf,colour,outline=false) => {
      const x=xOf(orf.start);
      const width=Math.max(6,xOf(orf.end+1)-x);
      const y=lane(orf.frame)-16;
      return `<rect x="${x}" y="${y}" width="${width}" height="32"
        rx="5" fill="${outline?'none':colour}"
        stroke="${outline?colour:'#111'}"
        stroke-width="${outline?3:1.5}"
        ${outline?'stroke-dasharray="5 3"':''}/>`;
    };

    const selected=state.orfs.map(o=>mark(o,'#1F66E5')).join('');
    const reference=state.checked?
      state.expectedORFs.orfs.map(o=>mark(o,'#3DBE6B',true)).join(''):'';
    const ticks=Array.from({length:6},(_,i)=>1+Math.round(i*(len-1)/5));
    const gc=state.expectedDNA.gc_fraction;

    return `<svg class="plot" viewBox="0 0 420 318" role="img"
      aria-label="Three forward reading frames with ${state.orfs.length} selected ORFs. GC fraction ${(gc*100).toFixed(1)} percent">
      <text x="210" y="20" text-anchor="middle" font-size="15"
        font-weight="800">Forward-strand reading frames</text>
      ${codons}${selected}${reference}
      <path d="M46 239H379" stroke="#111" stroke-width="2"/>
      ${ticks.map(v=>`
        <path d="M${xOf(v)} 239v6" stroke="#111" stroke-width="1.5"/>
        <text x="${xOf(v)}" y="260" font-size="10"
          text-anchor="middle">${v}</text>`).join('')}
      <text x="210" y="280" text-anchor="middle" font-size="12">Position (base index, 1-based)</text>
      <text x="210" y="302" text-anchor="middle" font-size="12"
        font-weight="800">GC fraction: ${gc===null?'undefined':(gc*100).toFixed(3)+'%'}</text>
    </svg>
    <div class="legend">
      <span><b style="background:#1F66E5"></b>Your ORF boxes</span>
      ${state.checked?'<span><b style="background:#3DBE6B"></b>Engine ORFs (dashed outline)</span>':''}
    </div>`;
  }

  function updatePlot() {
    if(state.type==='dijkstra'){
      $('plotWrap').innerHTML=distancePlot();
      const list=$('settledList');
      if(list) list.innerHTML=state.chosen.map((v,i)=>
        `<span>${i+1}. ${v}</span>`).join('')||'<span>Nothing settled yet</span>';
    } else if(state.type==='traversal'){
      $('plotWrap').innerHTML=traversalPlot();
      for(const kind of ['bfs','dfs']){
        const list=$(kind+'List');
        if(list) list.innerHTML=state[kind].map((v,i)=>
          `<span>${i+1}. ${v}</span>`).join('')||'<span>Empty</span>';
      }
    } else {
      $('plotWrap').innerHTML=dnaPlot();
      const list=$('orfList');
      if(list) list.innerHTML=state.orfs.map((v,i)=>`
        <span>F${v.frame}: ${v.start}–${v.end}
          <button data-remove="${i}" aria-label="Remove ORF ${i+1}"
            style="min-width:44px;margin-left:4px">×</button>
        </span>`).join('')||'<span>No ORFs marked</span>';
    }
  }

  function selectVertex(vertex) {
    if(state.solved || state.type==='dna') return;
    const key=state.type==='dijkstra'?'chosen':state.active;
    const array=state[key];
    const max=state.type==='dijkstra'?
      state.expected.settlement_order.length:
      state[key==='bfs'?'expectedBfs':'expectedDfs'].order.length;

    if(!array.includes(vertex) && array.length<max){
      array.push(vertex);
      $('figure').innerHTML=graphSvg();
      updatePlot();
    }
  }

  function wrong(text) {
    state.attempts++;
    message(text,'bad');
  }

  function success(text) {
    state.solved=true;
    const points=state.hint?50:state.attempts===0?100:
      state.attempts===1?75:50;
    score+=points;
    $('scoreLabel').textContent=`Score ${score}`;
    $('check').disabled=true;
    $('hint').disabled=true;
    $('next').hidden=false;
    $('next').textContent=round===5?'See results ★':'Next round →';
    message(`★ Correct! +${points} points. ${text}`,'good');
  }

  function compareOrder(actual,expected,name) {
    const index=actual.findIndex((v,i)=>v!==expected[i]);
    if(index>=0) return `${name} differs at visit ${index+1}.`;
    if(actual.length!==expected.length)
      return `${name} needs ${expected.length-actual.length} more visits.`;
    return '';
  }

  function checkDijkstra() {
    const expected=state.expected;
    const mismatch=compareOrder(
      state.chosen,expected.settlement_order,'Settlement order'
    );
    state.checked=true;
    updatePlot();
    if(mismatch){wrong(mismatch);return;}

    for(const vertex of Object.keys(state.graph)){
      const distance=expected.dist[vertex];
      if(distance===null){
        if(!state.noPath[vertex]){
          wrong(`Vertex ${vertex} is unreachable. Mark it “No path”.`);
          return;
        }
      } else {
        if(state.noPath[vertex]){
          wrong(`Vertex ${vertex} is reachable, so it needs a distance.`);
          return;
        }
        const entered=String(state.distances[vertex]).trim();
        if(!entered || Number(entered)!==distance){
          wrong(`The final distance to ${vertex} is incorrect. Check its incoming relaxations.`);
          return;
        }
      }
    }
    success('All reachable vertices were settled in order and all shortest distances are correct.');
  }

  function checkTraversal() {
    const bfs=state.expectedBfs.order;
    const dfs=state.expectedDfs.order;
    let mismatch=compareOrder(state.bfs,bfs,'BFS');
    state.checked=true;
    updatePlot();
    if(mismatch){wrong(mismatch);return;}
    mismatch=compareOrder(state.dfs,dfs,'DFS');
    if(mismatch){wrong(mismatch);return;}

    const first=bfs.findIndex((v,i)=>v!==dfs[i]);
    const a=$('firstBfs').value.trim().toUpperCase();
    const b=$('firstDfs').value.trim().toUpperCase();
    if(first>=0 && (a!==bfs[first]||b!==dfs[first])){
      wrong('The two orders are correct. Identify both vertices at their first differing visit index.');
      return;
    }
    if(state.cause!=='queue'){
      wrong('Revisit the distinction between the FIFO queue and recursive exploration.');
      return;
    }
    success('BFS follows queue order while DFS explores down a branch before backtracking.');
  }

  function proteinParts(raw) {
    const parts=raw.trim().split(/[\s,;]+/).filter(Boolean);
    return parts.map(w=>w.charAt(0).toUpperCase()+
      w.slice(1).toLowerCase());
  }

  function checkDNA() {
    const expected=state.expectedDNA;
    const typed=proteinParts($('protein').value);
    const reverse=$('reverse').value.replace(/\s/g,'').toUpperCase();
    state.checked=true;
    updatePlot();

    if(JSON.stringify(typed)!==JSON.stringify(expected.protein)){
      wrong('The translation differs. Read complete codons from base 1 and include the first Stop.');
      return;
    }
    if(reverse!==expected.reverse_complement){
      wrong('The reverse complement differs. Reverse the strand order and complement every base.');
      return;
    }

    function id(o) {return `${o.frame}:${o.start}:${o.end}`;}
    const expectedORFs=state.expectedORFs.orfs.map(id).sort();
    const selected=state.orfs.map(id).sort();
    if(JSON.stringify(expectedORFs)!==JSON.stringify(selected)){
      wrong(`The ORF boxes differ. You marked ${selected.length}; verify every start, stop and frame, including all qualifying ORFs.`);
      return;
    }

    success('Translation, reverse complement and all qualifying open reading frames match.');
  }

  function check() {
    if(state.solved)return;
    if(state.type==='dijkstra')checkDijkstra();
    else if(state.type==='traversal')checkTraversal();
    else checkDNA();
  }

  function hint() {
    if(state.solved)return;
    state.hint=true;
    message(state.type==='dijkstra'?
      'Hint: start with distance 0 at A. Settle the lowest tentative distance, then relax every outgoing edge. An unreached vertex remains without a path.':
      state.type==='traversal'?
      'Hint: BFS visits discovered vertices in queue order; DFS recursively follows the first available neighbour. Their first difference appears when the DFS branch goes deeper.':
      'Hint: a forward ORF starts with ATG and ends at its first in-frame stop. End coordinates include all three stop bases; translation from base 1 is a separate task.');
  }

  function endScreen() {
    const stars=score>=500?3:score>=350?2:1;
    $('app').innerHTML=`<div class="card end">
      <span class="badge">University (later years)</span>
      <h1>Paths and Genes completed!</h1>
      <div class="stars" aria-label="${stars} out of 3 stars">
        ${'★'.repeat(stars)}${'☆'.repeat(3-stars)}
      </div>
      <h2>${score} / 600 points</h2>
      <p class="sub">Six rounds of shortest paths, graph traversal and DNA analysis completed.</p>
      <button id="again" class="check">Play again ↻</button>
    </div>`;
    $('again').addEventListener('click',()=>location.reload());
  }

  $('figure').addEventListener('click',e=>{
    const target=e.target.closest('[data-vertex]');
    if(target)selectVertex(target.dataset.vertex);
  });
  $('figure').addEventListener('keydown',e=>{
    const target=e.target.closest('[data-vertex]');
    if(!target||(e.key!=='Enter'&&e.key!==' '))return;
    e.preventDefault();
    selectVertex(target.dataset.vertex);
  });

  $('controls').addEventListener('input',e=>{
    const vertex=e.target.dataset.distance;
    if(vertex!==undefined){
      state.distances[vertex]=e.target.value;
    }
  });

  $('controls').addEventListener('click',e=>{
    const no=e.target.closest('[data-nopath]');
    if(no){
      const v=no.dataset.nopath;
      state.noPath[v]=!state.noPath[v];
      no.classList.toggle('active',state.noPath[v]);
      no.setAttribute('aria-pressed',String(state.noPath[v]));
      const input=$('controls').querySelector(`[data-distance="${v}"]`);
      input.disabled=state.noPath[v];
      return;
    }

    const mode=e.target.closest('[data-mode]');
    if(mode && state.type==='traversal'){
      const a=$('firstBfs')?.value||'';
      const b=$('firstDfs')?.value||'';
      const cause=state.cause||'';
      state.active=mode.dataset.mode;
      render();
      $('firstBfs').value=a;
      $('firstDfs').value=b;
      state.cause=cause;
      $('causeChoices').querySelectorAll('button').forEach(btn=>{
        btn.classList.toggle('active',btn.dataset.cause===cause);
      });
      return;
    }

    const cause=e.target.closest('[data-cause]');
    if(cause){
      state.cause=cause.dataset.cause;
      $('causeChoices').querySelectorAll('button').forEach(btn=>{
        btn.classList.toggle('active',btn.dataset.cause===state.cause);
        btn.setAttribute('aria-pressed',String(btn.dataset.cause===state.cause));
      });
    }

    const undo=e.target.closest('[data-undo]');
    if(undo){
      state[undo.dataset.undo].pop();
      if(state.type!=='dna')$('figure').innerHTML=graphSvg();
      updatePlot();
    }
    const clear=e.target.closest('[data-clear]');
    if(clear){
      state[clear.dataset.clear]=[];
      if(state.type!=='dna')$('figure').innerHTML=graphSvg();
      updatePlot();
    }

    if(e.target.id==='addOrf'){
      const frame=Number($('orfFrame').value);
      const start=Number($('orfStart').value);
      const end=Number($('orfEnd').value);
      if(!Number.isInteger(start)||!Number.isInteger(end)||
          start<1||end>state.seq.length||end<start){
        message('Use valid 1-based start and end positions.','bad');
        return;
      }
      const candidate={frame,start,end};
      if(!state.orfs.some(v=>v.frame===frame&&
          v.start===start&&v.end===end)){
        state.orfs.push(candidate);
        updatePlot();
      }
    }

    if(e.target.id==='clearOrfs'){
      state.orfs=[];
      updatePlot();
    }
    const remove=e.target.closest('[data-remove]');
    if(remove){
      state.orfs.splice(Number(remove.dataset.remove),1);
      updatePlot();
    }
  });

  $('check').addEventListener('click',check);
  $('hint').addEventListener('click',hint);
  $('next').addEventListener('click',()=>{
    round++;
    if(round===6)endScreen();
    else initialise();
  });

  initialise();
})();
</script>
</body>
</html>
