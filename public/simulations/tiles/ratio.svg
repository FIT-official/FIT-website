    <use href="#ratio-tub" fill="#19C39A"/>
    <path d="M84 196H396" fill="none"/>
    <use href="#ratio-pot" transform="translate(64 56)" fill="#FFDD00"/>
    <use href="#ratio-pot" transform="translate(328 56)" fill="#2F6BFF"/>
    <path d="M64 82H152M328 82H416" fill="none"/>
    <circle cx="140" cy="228" r="14" fill="#FFDD00"/>
    <circle cx="180" cy="228" r="14" fill="#FFDD00"/>
    <circle cx="290" cy="228" r="14" fill="#2F6BFF"/>
    <circle cx="330" cy="228" r="14" fill="#2F6BFF"/>
    <circle cx="370" cy="228" r="14" fill="#2F6BFF"/>
  </g>
  <g id="ratio-symbols" fill="#111111" stroke="#111111" stroke-width="2">
    <circle cx="240" cy="214" r="5"/>
