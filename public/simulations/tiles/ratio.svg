<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Ratio: two paint pots pour into a mixing tub"><title>Ratio</title>
  <defs>
    <pattern id="ratio-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#E6E6E6"/>
    </pattern>
    <rect id="ratio-pot" width="88" height="70" rx="10"/>
    <rect id="ratio-tub" x="84" y="176" width="312" height="92" rx="14"/>
  </defs>
  <g id="ratio-bg">
    <rect width="480" height="360" fill="#FEFEFE"/>
    <rect width="480" height="360" fill="url(#ratio-dots)"/>
    <circle cx="240" cy="170" r="120" fill="#FFDD00" opacity=".35"/>
  </g>
  <g id="ratio-subject" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <use href="#ratio-pot" transform="translate(70 62)" fill="#111111"/>
    <use href="#ratio-pot" transform="translate(334 62)" fill="#111111"/>
    <rect x="100" y="120" width="16" height="76" fill="#FFDD00"/>
    <rect x="364" y="120" width="16" height="76" fill="#2F6BFF"/>
