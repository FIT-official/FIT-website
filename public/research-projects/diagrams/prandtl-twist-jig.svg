<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Measuring wing twist in a jig (suggested)</title>
<desc id="d">Side view of a flat wing resting on a block at the root and another block at the tip with a thin wedge. A digital angle gauge on top of the wing at the root and at the tip reads two different angles, giving the tip twist.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker></defs>
<rect x="0.75" y="0.75" width="638.5" height="378.5" rx="10" fill="#ffffff" stroke="#5b6877" stroke-width="1.5"/>
<text x="16" y="24" font-size="11" fill="#5b6877" text-anchor="start" font-weight="700">DIAGRAM · original explanatory illustration, not a photograph</text>
<text x="16" y="48" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="700">Measuring wing twist in a jig (suggested)</text>
<line x1="40" y1="300" x2="600" y2="300" stroke="#5b6877" stroke-width="2"/>
<rect x="90" y="252" width="70" height="48" rx="6" fill="#f1f5f9" stroke="#1b2a3a" stroke-width="1.5"/><text x="125" y="280" font-size="11" fill="#1b2a3a" text-anchor="middle">root block</text>
<rect x="480" y="252" width="70" height="48" rx="6" fill="#f1f5f9" stroke="#1b2a3a" stroke-width="1.5"/><text x="515" y="280" font-size="11" fill="#1b2a3a" text-anchor="middle">tip block</text>
<path d="M520 252 L550 252 L550 240 Z" fill="#b45309" stroke="#1b2a3a"/>
<text x="560" y="244" font-size="12" fill="#b45309" text-anchor="start">wedge</text>
<path d="M100 252 L540 240 L540 232 L100 244 Z" fill="#fde68a" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="110" y="214" width="60" height="28" rx="6" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/><text x="140" y="232" font-size="11" fill="#1b2a3a" text-anchor="middle">gauge</text>
<text x="140" y="206" font-size="12" fill="#1b2a3a" text-anchor="middle">angle at root</text>
<rect x="450" y="196" width="60" height="28" rx="6" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/><text x="480" y="214" font-size="11" fill="#1b2a3a" text-anchor="middle">gauge</text>
<text x="480" y="188" font-size="12" fill="#1b2a3a" text-anchor="middle">angle at tip</text>
<text x="320" y="110" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="700">twist = angle(tip) - angle(root)</text>
<text x="320" y="134" font-size="13" fill="#1b7a4b" text-anchor="middle">negative = washout (tip at lower angle of attack)</text>
<text x="24" y="360" font-size="12" fill="#5b6877" text-anchor="start">Record the gauge reading uncertainty; re-check before every flight session.</text>
</svg>
