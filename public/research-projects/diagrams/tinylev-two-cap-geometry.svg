<title id="t">Two opposed emitter caps and the common axis</title>
<desc id="d">Cross-section: two curved caps of small circles (emitters) face each other above and below a vertical dashed axis. The centre is marked, with the cap radius R and polar angle theta drawn for one emitter. A bead is shown at a pressure node on the axis.</desc>
