<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Sensor and estimator flow (proposed)</title>
<desc id="d">Flow diagram: wheel encoders and a heading-rate sensor feed a dead-reckoning block. A LiDAR scan feeds a map-match block that outputs an absolute position fix, which can drop out. Both go into a correction block that outputs the position estimate, which is compared with surveyed ground-truth marks to give the error.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker></defs>
<rect x="0.75" y="0.75" width="638.5" height="378.5" rx="10" fill="#ffffff" stroke="#5b6877" stroke-width="1.5"/>
<text x="16" y="24" font-size="11" fill="#5b6877" text-anchor="start" font-weight="700">DIAGRAM · original explanatory illustration, not a photograph</text>
<text x="16" y="48" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="700">Sensor and estimator flow (proposed)</text>
<rect x="24" y="90" width="130" height="44" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="89" y="116" font-size="13" fill="#1b2a3a" text-anchor="middle">Wheel encoders</text>
<rect x="24" y="146" width="130" height="44" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="89" y="172" font-size="13" fill="#1b2a3a" text-anchor="middle">Heading-rate sensor</text>
<rect x="200" y="108" width="140" height="64" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="270" y="136.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Dead reckoning</text><text x="270" y="151.5" font-size="13" fill="#1b2a3a" text-anchor="middle">(drifts)</text>
<line x1="154" y1="112" x2="200" y2="128" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="154" y1="168" x2="200" y2="152" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="24" y="250" width="130" height="44" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="89" y="276" font-size="13" fill="#1b2a3a" text-anchor="middle">2D LiDAR scan</text>
<rect x="200" y="250" width="140" height="44" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="270" y="276" font-size="13" fill="#1b2a3a" text-anchor="middle">Map match</text>
<line x1="154" y1="272" x2="200" y2="272" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="316" font-size="12" fill="#b45309" text-anchor="middle">absolute fix (can drop out)</text>
<rect x="400" y="170" width="130" height="70" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="465" y="201.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Correction</text><text x="465" y="216.5" font-size="13" fill="#1b2a3a" text-anchor="middle">x += K (z - x)</text>
<line x1="340" y1="140" x2="400" y2="195" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="272" x2="400" y2="225" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="550" y="170" width="76" height="70" rx="6" fill="#eef3f8" stroke="#1b2a3a" stroke-width="1.5"/><text x="588" y="201.5" font-size="13" fill="#1b2a3a" text-anchor="middle">Position</text><text x="588" y="216.5" font-size="13" fill="#1b2a3a" text-anchor="middle">estimate</text>
<line x1="530" y1="205" x2="550" y2="205" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400" y="90" width="226" height="44" rx="6" fill="#ecfdf3" stroke="#1b7a4b" stroke-width="1.5"/><text x="513" y="116" font-size="13" fill="#1b2a3a" text-anchor="middle">Surveyed ground-truth marks</text>
<line x1="588" y1="134" x2="588" y2="170" stroke="#1b7a4b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="156" font-size="12" fill="#1b7a4b" text-anchor="middle">compare: error</text>
<text x="24" y="366" font-size="12" fill="#5b6877" text-anchor="start">The fixed-gain correction does not estimate heading; a real filter would.</text>
</svg>
